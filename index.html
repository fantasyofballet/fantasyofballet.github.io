<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Գրանցում</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background: white;
        }

        .dob-row {
            display: flex;
            gap: 8px;
        }

        .dob-row select:nth-child(1) { flex: 1; }
        .dob-row select:nth-child(2) { flex: 2; }
        .dob-row select:nth-child(3) { flex: 1.3; }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Երեխայի Գրանցման Ձև</h2>
        <form id="registrationForm">

            <div class="form-group">
                <label for="childName">Երեխայի Անուն *</label>
                <input type="text" id="childName" required placeholder="Անուն" maxlength="60">
            </div>

            <div class="form-group">
                <label for="childSurname">Երեխայի Ազգանուն *</label>
                <input type="text" id="childSurname" required placeholder="Ազգանուն" maxlength="60">
            </div>

            <div class="form-group">
                <label>Ծննդյան Ամսաթիվ *</label>
                <div class="dob-row">
                    <select id="dobDay" required aria-label="Օր"></select>
                    <select id="dobMonth" required aria-label="Ամիս"></select>
                    <select id="dobYear" required aria-label="Տարի"></select>
                </div>
            </div>

            <div class="form-group">
                <label for="parentName">Ծնողի Անուն Ազգանուն *</label>
                <input type="text" id="parentName" required placeholder="Անուն Ազգանուն" maxlength="100">
            </div>

            <div class="form-group">
                <label for="phone">Հեռախոսահամար *</label>
                <input type="tel" id="phone" required placeholder="+374 XXXXXXXX" maxlength="30">
            </div>

            <div class="form-group">
                <label for="phone2">Հեռախոսահամար 2</label>
                <input type="tel" id="phone2" placeholder="+374 XXXXXXXX" maxlength="30">
            </div>

            <div class="form-group">
                <label for="address">Հասցե *</label>
                <input type="text" id="address" required placeholder="Հասցե" maxlength="200">
            </div>

            <div class="form-group">
                <label for="photoFile">Կցել Նկար (պարտադիր չէ)</label>
                <input type="file" id="photoFile" accept="image/*">
                <div class="hint">Նկարը պարտադիր չէ. կարող եք գրանցվել նաև առանց նկարի։</div>
            </div>

            <button type="submit" id="submitBtn">Գրանցվել</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Նոր Firebase (ballet)
        const firebaseConfig = {
            apiKey: "AIzaSyDgyGEMIJfrT_N-U-a-39_U7N5JKfsLrvg",
            authDomain: "ballet-82dcb.firebaseapp.com",
            projectId: "ballet-82dcb",
            storageBucket: "ballet-82dcb.firebasestorage.app",
            messagingSenderId: "1020750431146",
            appId: "1:1020750431146:web:e2880c0d6a26a9ba3a21d3",
            measurementId: "G-N0W4X2ZLKJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Նոր Cloudinary
        const CLOUDINARY_CLOUD_NAME = "xvaxriwv";
        const CLOUDINARY_UPLOAD_PRESET = "ballet";

        const form = document.getElementById('registrationForm');

        // ---------- Ծննդյան ամսաթիվ՝ Օր / Ամիս / Տարի ----------
        const daySel = document.getElementById('dobDay');
        const monthSel = document.getElementById('dobMonth');
        const yearSel = document.getElementById('dobYear');

        const months = ["Հունվար", "Փետրվար", "Մարտ", "Ապրիլ", "Մայիս", "Հունիս",
            "Հուլիս", "Օգոստոս", "Սեպտեմբեր", "Հոկտեմբեր", "Նոյեմբեր", "Դեկտեմբեր"];

        function addOption(select, value, text) {
            const o = document.createElement('option');
            o.value = value;
            o.textContent = text;
            select.appendChild(o);
        }

        addOption(daySel, "", "Օր");
        for (let d = 1; d <= 31; d++) addOption(daySel, String(d), String(d));

        addOption(monthSel, "", "Ամիս");
        months.forEach((m, i) => addOption(monthSel, String(i + 1), m));

        addOption(yearSel, "", "Տարի");
        const thisYear = new Date().getFullYear();
        for (let y = thisYear; y >= thisYear - 18; y--) addOption(yearSel, String(y), String(y));

        // Օրերի քանակը փոխվում է ըստ ամսվա և տարվա (օր.՝ Փետրվար = 28/29)
        function updateDays() {
            const m = parseInt(monthSel.value, 10);
            const y = parseInt(yearSel.value, 10) || 2000; // նահանջ տարվա համար
            const maxDay = m ? new Date(y, m, 0).getDate() : 31;
            const current = parseInt(daySel.value, 10);

            daySel.innerHTML = "";
            addOption(daySel, "", "Օր");
            for (let d = 1; d <= maxDay; d++) addOption(daySel, String(d), String(d));
            if (current && current <= maxDay) daySel.value = String(current);
        }
        monthSel.addEventListener('change', updateDays);
        yearSel.addEventListener('change', updateDays);

        function getDob() {
            const d = daySel.value, m = monthSel.value, y = yearSel.value;
            if (!d || !m || !y) return "";
            return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }

        // Նկարի փոքրացում՝ մինչ Cloudinary ուղարկելը (max 1000px)
        function resizeImage(file, maxSize = 1000, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = (e) => { img.src = e.target.result; };
                reader.onerror = reject;

                img.onload = () => {
                    let { width, height } = img;
                    if (width > height) {
                        if (width > maxSize) {
                            height = Math.round(height * (maxSize / width));
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width = Math.round(width * (maxSize / height));
                            height = maxSize;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        if (!blob) { reject(new Error("Նկարը հնարավոր չեղավ սեղմել")); return; }
                        resolve(blob);
                    }, 'image/jpeg', quality);
                };

                img.onerror = () => reject(new Error("Նկարը հնարավոր չեղավ բացել"));
                reader.readAsDataURL(file);
            });
        }

        async function uploadPhoto(file) {
            const resizedBlob = await resizeImage(file, 1000, 0.8);
            const cloudinaryData = new FormData();
            cloudinaryData.append("file", resizedBlob, "photo.jpg");
            cloudinaryData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                method: "POST",
                body: cloudinaryData
            });
            if (!response.ok) throw new Error("Cloudinary upload failed");

            const result = await response.json();
            return result.secure_url.replace("/upload/", "/upload/f_webp,q_auto/");
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const childDob = getDob();
            if (!childDob) {
                alert("Խնդրում ենք ընտրել ծննդյան օրը, ամիսը և տարին:");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Ուղարկվում է...";

            const file = document.getElementById('photoFile').files[0];
            let photoUrl = "";
            let photoFailed = false;

            try {
                // Նկարը պարտադիր չէ՝ բեռնվում է միայն եթե ընտրված է.
                // եթե նկարի բեռնումը ձախողվի, գրանցումը միևնույն է կատարվում է առանց նկարի
                if (file) {
                    submitBtn.textContent = "Նկարը մշակվում է...";
                    try {
                        photoUrl = await uploadPhoto(file);
                    } catch (photoError) {
                        console.error("Նկարի սխալ: ", photoError);
                        photoFailed = true;
                    }
                    submitBtn.textContent = "Ուղարկվում է...";
                }

                const formData = {
                    childName: document.getElementById('childName').value.trim(),
                    childSurname: document.getElementById('childSurname').value.trim(),
                    childDob: childDob,
                    parentName: document.getElementById('parentName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    phone2: document.getElementById('phone2').value.trim(),
                    address: document.getElementById('address').value.trim(),
                    photoUrl: photoUrl,
                    createdAt: new Date()
                };

                // Պահպանում Firestore-ում ("registrations" հավաքածու)
                await addDoc(collection(db, "registrations"), formData);

                alert(photoFailed
                    ? "Տվյալները պահպանվեցին, բայց նկարը չբեռնվեց:"
                    : "Տվյալները հաջողությամբ պահպանվեցին դպրոցի բազայում:");
                form.reset();
                updateDays();

            } catch (error) {
                console.error("Սխալ տեղի ունեցավ: ", error);
                alert("Գրանցման սխալ. " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Գրանցվել";
            }
        });
    </script>

</body>

</html>
